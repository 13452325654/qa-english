<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试英语突击 · 软件测试面试英语打卡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314161A'/%3E%3Ctext x='32' y='34' font-family='monospace' font-size='24' font-weight='700' fill='%23F7F5EF' text-anchor='middle'%3EEN%3C/text%3E%3Cpath d='M18 44l7 7 16-18' stroke='%232FA36B' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#14161A">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="测试英语">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F3F1EA; --card:#FFFDF8; --ink:#14161A; --green:#1E6B4F; --green2:#2FA36B;
  --red:#C4472E; --muted:#6B6A66; --line:#DAD5C8; --tap:#EDEAE0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- 头部 ---------- */
.hd{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px 9px;max-width:1080px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#F7F5EF;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.5px;flex:none}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-t{font-family:'Noto Serif SC',serif;font-weight:900;font-size:16px;letter-spacing:.5px;line-height:1.2}
.brand-s{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:1.4px;margin-top:2px}
.streak{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:100px;padding:5px 11px;font-size:12px;white-space:nowrap;flex:none}
.streak b{font-family:'IBM Plex Mono',monospace;color:var(--red);font-size:13px}
.tabs{display:flex;overflow-x:auto;gap:2px;padding:0 10px 0;max-width:1080px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 12px 11px;font-size:13.5px;color:var(--muted);font-family:inherit;position:relative;cursor:pointer;min-height:44px}
.tab.on{color:var(--ink);font-weight:700}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:3px;background:var(--red)}

/* ---------- 通用 ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 40px}
.view{display:none}
.view.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.panel-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 13px;border-bottom:1px dashed var(--line)}
.panel-t{font-family:'Noto Serif SC',serif;font-weight:700;font-size:14px;letter-spacing:.3px}
.panel-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
.panel-bd{padding:12px 13px}
.sect-h{display:flex;align-items:baseline;gap:9px;margin:18px 0 9px}
.sect-h h2{font-family:'Noto Serif SC',serif;font-size:15px;margin:0;font-weight:700}
.sect-h span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}

/* ---------- 单词卡 ---------- */
.wcard{background:var(--card);border:1px solid var(--line);padding:11px 13px 10px;margin-bottom:9px;position:relative}
.wcard.done{border-color:var(--green2);background:#FAFDF9}
.w-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.w-w{font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;line-height:1.3;word-break:break-word}
.w-ipa{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--green);margin-top:2px}
.w-zh{font-size:13.5px;margin-top:5px}
.w-ex{font-size:12.5px;color:#3C3A36;margin-top:7px;padding-top:7px;border-top:1px dotted var(--line)}
.w-ex b{font-weight:500;color:var(--ink)}
.w-ex span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.spk{width:44px;height:44px;min-width:44px;border:1px solid var(--line);border-radius:50%;background:var(--tap);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.spk:active{background:#E2DDD0}
.spk svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.8}
.spk.playing{background:var(--green2);border-color:var(--green2)}
.spk.playing svg{stroke:#fff}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.6px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}

/* ---------- 今日 ---------- */
.today-top{display:flex;gap:10px;align-items:center;margin-bottom:13px}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:64px;height:64px}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;line-height:1}
.ring .rl{font-size:8.5px;color:var(--muted);letter-spacing:.8px}
.today-p{flex:1;min-width:0}
.today-p .tp1{font-family:'Noto Serif SC',serif;font-weight:700;font-size:14.5px}
.today-p .tp2{font-size:12px;color:var(--muted);margin-top:2px}
.check-btn{width:100%;border:0;background:var(--ink);color:#FFFDF8;font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;letter-spacing:1px;padding:14px;cursor:pointer;margin-top:4px;min-height:48px}
.check-btn:disabled{background:#C9C4B6;color:#7E7A6E}
.check-btn.done{background:var(--green)}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:7px}

/* ---------- 句子卡 ---------- */
.scard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--green);padding:11px 13px;margin-bottom:9px}
.scard-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scard-t{font-size:11.5px;color:var(--muted)}
.scard-en{font-size:14px;line-height:1.75;margin-top:7px;font-weight:500}
.scard-zh{font-size:12.5px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dotted var(--line)}
.scard-note{font-size:11.5px;color:var(--green);margin-top:6px}

/* ---------- 复习 ---------- */
.rev-card{background:var(--card);border:1px solid var(--line);padding:22px 16px;text-align:center;margin-bottom:12px}
.rev-q{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;line-height:1.5}
.rev-ipa{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--green);margin-top:6px}
.rev-a{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:none}
.rev-a.on{display:block}
.rev-btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:1px solid var(--ink);background:var(--card);color:var(--ink);padding:12px;font-size:13.5px;font-family:inherit;cursor:pointer;min-height:46px}
.btn.pri{background:var(--ink);color:#FFFDF8}
.btn.okv{border-color:var(--green2);color:var(--green);background:#F6FBF8}
.rdone{text-align:center;padding:26px 14px;border:1px dashed var(--line);color:var(--muted);font-size:13px}

/* ---------- 打卡 ---------- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.stat{background:var(--card);border:1px solid var(--line);padding:10px 11px}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:21px;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.cal i{aspect-ratio:1;background:var(--tap);display:block}
.cal i.on{background:var(--green2)}
.cal i.today{outline:2px solid var(--red);outline-offset:1px}
.cal-lg{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:7px}
.log-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:12.5px}
.log-item:last-child{border-bottom:0}
.log-d{font-family:'IBM Plex Mono',monospace;font-size:12px}
.log-m{color:var(--muted);font-size:11px}

/* ---------- 工具栏 ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;padding:7px 11px;cursor:pointer;font-family:inherit;min-height:38px}
.chip.on{background:var(--ink);color:#FFFDF8;border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px;font-family:inherit;margin-bottom:11px}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:13px;border:1px dashed var(--line);background:var(--card)}

/* ---------- 自定义词条 ---------- */
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:1px dashed var(--green);background:#F6FBF8;color:var(--green);font-family:inherit;font-size:13px;padding:10px 12px;min-height:44px;cursor:pointer;margin-bottom:11px}
.cust-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.5px;color:var(--red);border:1px solid var(--red);padding:0 5px;margin-left:6px;vertical-align:2px}
.mini-btn{border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:inherit;font-size:11.5px;padding:5px 9px;cursor:pointer;min-height:32px}
.del-txt{color:var(--red);border-color:#E8C9C1;background:#FFF6F4}
.mask{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:40;display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-top:2px solid var(--ink);padding:15px 16px 20px;max-height:90vh;overflow:auto;transform:translateY(102%);transition:transform .22s ease-out;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-t{font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px}
.sheet-x{width:36px;height:36px;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
.kind{display:flex;gap:6px;margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.inp{width:100%;border:1px solid var(--line);background:var(--paper);padding:11px 12px;font-size:16px;font-family:inherit;resize:vertical;line-height:1.6}
.inp:focus{outline:2px solid var(--green2);outline-offset:-1px}
.tr-state{font-size:11.5px;min-height:17px;color:var(--green);margin:-2px 0 8px}
.tr-state.err{color:var(--red)}
.sheet-btns{display:flex;gap:8px;margin-top:4px}

/* ---------- 桌面 ---------- */
@media (min-width:760px){
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  .cols > *{min-width:0}
  #todayWords,#wordList,#sentList{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
  #todayWords > *, #wordList > *, #sentList > *{min-width:0}
  #sentList > .sect-h{grid-column:1/-1}
  .w-w{font-size:21px}
  .cal{grid-template-columns:repeat(20,1fr)}
  .check-btn{max-width:460px;margin-left:auto;margin-right:auto}
  .today-top{max-width:460px}
}
@media (prefers-reduced-motion:no-preference){
  .view.on{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.6}to{opacity:1}}
}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <div class="brand">
      <div class="logo">EN</div>
      <div>
        <div class="brand-t">测试英语突击</div>
        <div class="brand-s">QA ENGLISH · 打卡积累</div>
      </div>
    </div>
    <div class="streak" id="streakChip">连续 <b>0</b> 天</div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-view="today">今日</button>
    <button class="tab" data-view="words">词库</button>
    <button class="tab" data-view="sents">句子段落</button>
    <button class="tab" data-view="review">复习<span id="revBadge" style="display:none;margin-left:4px;background:#C4472E;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:1px 5px;border-radius:9px;vertical-align:1px"></span></button>
    <button class="tab" data-view="log">我的打卡</button>
  </nav>
</header>

<main class="wrap">

  <!-- ===== 今日 ===== -->
  <section class="view on" id="v-today">
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-t" id="todayTitle">今日任务</div>
        <div class="panel-meta" id="todayMeta"></div>
      </div>
      <div class="panel-bd">
        <div class="today-top">
          <div class="ring">
            <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#DAD5C8" stroke-width="4"/>
              <circle id="ringArc" cx="32" cy="32" r="28" fill="none" stroke="#1E6B4F" stroke-width="4" stroke-dasharray="176" stroke-dashoffset="176" stroke-linecap="round" transform="rotate(-90 32 32)"/></svg>
            <div class="rv"><span id="ringNum">0</span><span class="rl" id="ringTotal">/ 11</span></div>
          </div>
          <div class="today-p">
            <div class="tp1" id="tp1">先过一遍今天的卡片</div>
            <div class="tp2" id="tp2">点卡片右下角「记住了」，全部过完即可打卡</div>
          </div>
        </div>
        <button class="check-btn" id="btnCheck" disabled>打卡</button>
        <div class="hint" id="checkHint">今天还没过完，先去下面的卡片</div>
      </div>
    </div>

    <div class="sect-h"><h2>今日单词</h2><span id="todayWordCount"></span></div>
    <div id="todayWords"></div>

    <div class="sect-h"><h2>今日句子</h2><span></span></div>
    <div id="todaySents"></div>

    <div class="sect-h"><h2>今日面试题</h2><span></span></div>
    <div id="todayQa"></div>
  </section>

  <!-- ===== 词库 ===== -->
  <section class="view" id="v-words">
    <button class="add-btn" id="btnAddWord">＋ 添加自己的词（中文自动翻成英文）</button>
    <input class="search" id="wordSearch" type="search" placeholder="搜英文或中文，比如 regression / 回归" autocomplete="off">
    <div class="chips" id="wordChips"></div>
    <div id="wordList"></div>
  </section>

  <!-- ===== 句子段落 ===== -->
  <section class="view" id="v-sents">
    <button class="add-btn" id="btnAddSent">＋ 添加自己的句子 / 段落</button>
    <div class="chips" id="sentChips"></div>
    <div id="sentList"></div>
  </section>

  <!-- ===== 复习 ===== -->
  <section class="view" id="v-review">
    <div class="panel">
      <div class="panel-hd">
        <div class="panel-t">到期复习</div>
        <div class="panel-meta" id="revMeta"></div>
      </div>
      <div class="panel-bd" id="revBody"></div>
    </div>
  </section>

  <!-- ===== 打卡记录 ===== -->
  <section class="view" id="v-log">
    <div class="stat-row">
      <div class="stat"><b id="stStreak">0</b><span>连续天数</span></div>
      <div class="stat"><b id="stDays">0</b><span>累计打卡</span></div>
      <div class="stat"><b id="stWords">0</b><span>学过的词</span></div>
    </div>
    <div class="panel">
      <div class="panel-hd"><div class="panel-t">打卡日历</div><div class="panel-meta">最近 13 周</div></div>
      <div class="panel-bd">
        <div class="cal" id="cal"></div>
        <div class="cal-lg" id="calLegend"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd"><div class="panel-t">打卡明细</div><div class="panel-meta" id="logCount"></div></div>
      <div class="panel-bd" id="logBody"></div>
    </div>
  </section>

</main>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-hd">
    <div class="sheet-t" id="sheetTitle">添加词条</div>
    <button class="sheet-x" id="sheetClose" aria-label="关闭">✕</button>
  </div>
  <div class="kind">
    <button class="chip on" data-kind="word">单词</button>
    <button class="chip" data-kind="sent">句子 / 段落</button>
  </div>
  <div class="field">
    <label id="lblInput">输入中文，会自动翻成英文</label>
    <textarea class="inp" id="addInput" rows="2" placeholder="比如：我在上一个项目负责支付模块的接口测试"></textarea>
  </div>
  <div class="tr-state" id="trState"></div>
  <div class="field">
    <label>英文（可改）</label>
    <textarea class="inp" id="addEn" rows="2" placeholder="English version"></textarea>
  </div>
  <div class="field">
    <label>中文（可改）</label>
    <input class="inp" id="addZh" type="text" placeholder="中文释义 / 翻译">
  </div>
  <div class="field" id="fldIpa" style="display:none">
    <label>音标（可选，自己抄一下更准）</label>
    <input class="inp mono" id="addIpa" type="text" placeholder="比如 /rɪˈɡreʃən/">
  </div>
  <div class="field">
    <label>例句或备注（可选）</label>
    <textarea class="inp" id="addNote" rows="2" placeholder="想记的用法、场景、自己的备注"></textarea>
  </div>
  <div class="sheet-btns">
    <button class="btn" id="btnCancel">取消</button>
    <button class="btn pri" id="btnSave">保存</button>
  </div>
</div>

<script>
const CATS={
  intro:'自我介绍', term:'测试术语', bug:'缺陷与用例', proc:'流程与环境', tool:'工具与CI', comm:'沟通与面试'
};
const WORDS=[
 /* 自我介绍 */
 {id:'w1',c:'intro',w:'experience',ipa:'/ɪkˈspɪəriəns/',p:'n.',zh:'经验；经历',ex:'I have three years of experience in software testing.',exz:'我有三年软件测试经验。'},
 {id:'w2',c:'intro',w:'background',ipa:'/ˈbækɡraʊnd/',p:'n.',zh:'背景；出身',ex:'My background is in computer science.',exz:'我的专业背景是计算机。'},
 {id:'w3',c:'intro',w:'responsible',ipa:'/rɪˈspɒnsəbl/',p:'adj.',zh:'负责的；承担责任的',ex:'I was responsible for the payment module.',exz:'我负责支付模块。'},
 {id:'w4',c:'intro',w:'familiar',ipa:'/fəˈmɪliə/',p:'adj.',zh:'熟悉的',ex:'I am familiar with API testing and CI pipelines.',exz:'我熟悉接口测试和 CI 流水线。'},
 {id:'w5',c:'intro',w:'proficient',ipa:'/prəˈfɪʃənt/',p:'adj.',zh:'熟练的',ex:'I am proficient in Python and Postman.',exz:'我熟练使用 Python 和 Postman。'},
 {id:'w6',c:'intro',w:'collaborate',ipa:'/kəˈlæbəreɪt/',p:'v.',zh:'协作；配合',ex:'I collaborate closely with developers and product managers.',exz:'我和开发、产品保持紧密协作。'},
 {id:'w7',c:'intro',w:'candidate',ipa:'/ˈkændɪdət/',p:'n.',zh:'候选人；应试者',ex:'As a candidate, I focus on real testing experience.',exz:'作为候选人，我更强调真实的测试经验。'},
 {id:'w8',c:'intro',w:'strength',ipa:'/streŋθ/',p:'n.',zh:'优势；长处',ex:'My biggest strength is finding edge cases.',exz:'我最大的优势是能想到边界场景。'},

<script>
/* ================= 基础 ================= */
const LS='qa-english-v1';
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));

function todayStr(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function addDays(str,n){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function dayIndex(str){ return Math.floor(new Date(str+'T00:00:00').getTime()/86400000); }

let state={checkins:[],learned:{},done:{},view:'today'};
try{
  const raw=localStorage.getItem(LS);
  if(raw){ const o=JSON.parse(raw); state=Object.assign(state,o); }
}catch(e){}
function save(){ try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){} }

const WORDS_BY_ID={}; WORDS.forEach(w=>WORDS_BY_ID[w.id]=w);
const SENTS_BY_ID={}; SENTS.forEach(s=>SENTS_BY_ID[s.id]=s);
const QA_BY_ID={}; QA.forEach(q=>QA_BY_ID[q.id]=q);

/* ================= 自建词条 ================= */
function custList(kind){ return (state.custom||[]).filter(i=>i.kind===kind); }
function wObj(c){ return {id:c.id,c:'custom',custom:1,w:c.en||c.zh,ipa:c.ipa||'',p:'',zh:c.zh||'',ex:c.note||'',exz:''}; }
function sObj(c){ return {id:c.id,c:'custom',custom:1,t:(c.zh||c.en||'').slice(0,20)||'自建句子',en:c.en||c.zh,zh:c.zh||'',note:c.note||''}; }
function allWords(){ return WORDS.concat(custList('word').map(wObj)); }
function allSents(){ return SENTS.concat(custList('sent').map(sObj)); }
function getW(id){ return WORDS_BY_ID[id] || allWords().find(x=>x.id===id) || null; }
function getS(id){ return SENTS_BY_ID[id] || allSents().find(x=>x.id===id) || null; }
function getQ(id){ return QA_BY_ID[id] || null; }

/* ================= 朗读 ================= */
let voiceWant=null, curAudio=null;
function pickVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  if(!vs.length) return null;
  return vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/en[-_](GB|AU|CA)/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){
  voiceWant=pickVoice();
  speechSynthesis.addEventListener('voiceschanged',()=>{ voiceWant=pickVoice(); });
}
function hasEnVoice(){
  if(!('speechSynthesis' in window)) return false;
  const vs=(speechSynthesis.getVoices()||[]);
  if(!vs.length) return true; // 还没加载完，先按可用处理
  return !!pickVoice();
}
function stopAll(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio=null; }
}
let playBtn=null;
function setPlaying(btn,on){
  if(!btn) return;
  btn.classList.toggle('playing',!!on);
  if(on) playBtn=btn; else if(playBtn===btn) playBtn=null;
}
/* 在线发音兜底：用公开的 TTS 音频接口，安卓端没装英文语音引擎时也能出声 */
function ttsUrls(text){
  const t=text.trim();
  const enc=encodeURIComponent(t);
  const urls=[];
  if(!/\s/.test(t)) urls.push('https://dict.youdao.com/dictvoice?audio='+enc+'&type=2');
  urls.push('https://fanyi.baidu.com/gettts?lan=en&text='+enc+'&spd=3&source=web');
  return urls;
}
function speakAudio(text,btn){
  const urls=ttsUrls(text);
  let i=0, settled=false;
  const finish=(ok)=>{
    if(settled) return; settled=true;
    setPlaying(btn,false);
    if(!ok) toast('朗读失败：网络不通或音频被拦截');
  };
  const next=()=>{
    if(i>=urls.length){ finish(false); return; }
    const a=new Audio(urls[i++]); curAudio=a;
    a.onended=()=>finish(true);
    a.onerror=()=>{ if(!settled) next(); };
    const p=a.play();
    if(p&&p.catch) p.catch(()=>{ if(!settled) next(); });
  };
  next();
}
function speak(text,btn){
  stopAll();
  if(playBtn) setPlaying(playBtn,false);
  setPlaying(btn,true);
  const t=(text||'').trim();
  if(!t){ setPlaying(btn,false); return; }
  if('speechSynthesis' in window && hasEnVoice()){
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=0.92; u.pitch=1;
    const v=pickVoice()||voiceWant; if(v) u.voice=v;
    let fell=false, started=false, timer=null;
    u.onstart=()=>{ started=true; clearTimeout(timer); };
    u.onend=()=>{ clearTimeout(timer); setPlaying(btn,false); };
    u.onerror=()=>{ if(!fell){ fell=true; clearTimeout(timer); setPlaying(btn,false); speakAudio(t,btn); } };
    try{ speechSynthesis.speak(u); }catch(e){ fell=true; speakAudio(t,btn); return; }
    // 手机没装英文语音引擎时会静默失败：没开始发声就自动切在线音频
    timer=setTimeout(()=>{
      if(started||fell) return;
      fell=true;
      try{ speechSynthesis.cancel(); }catch(e){}
      setPlaying(btn,false); speakAudio(t,btn);
    },400);
    return;
  }
  speakAudio(t,btn);
}
function spkBtn(text){
  return '<button class="spk" data-say="'+encodeURIComponent(text)+'" aria-label="朗读"><svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg></button>';
}

/* ================= 提示 ================= */
let toastT=null;
function toast(msg){
  let n=document.getElementById('toast');
  if(!n){ n=document.createElement('div'); n.id='toast';
    n.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);pointer-events:none;background:#14161A;color:#FFFDF8;font-size:13px;padding:10px 16px;border-radius:4px;z-index:99;max-width:86vw;text-align:center;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.25)';
    document.body.appendChild(n);
  }
  n.textContent=msg; n.style.opacity='1';
  clearTimeout(toastT);
  toastT=setTimeout(()=>{ n.style.transition='opacity .3s'; n.style.opacity='0'; },2200);
}

/* ================= 今日计划 ================= */
function todayPlan(){
  const idx=dayIndex(todayStr());
  const cw=custList('word'), cs=custList('sent');
  const words=[];
  const cwTake=Math.min(2,cw.length);
  for(let i=0;i<cwTake;i++) words.push(wObj(cw[(idx+i)%cw.length]));
  const need=8-words.length;
  const wStart=(idx*need)%WORDS.length;
  for(let i=0;i<need;i++){ const w=WORDS[(wStart+i)%WORDS.length]; if(!words.some(x=>x.id===w.id)) words.push(w); }
  let g=0;
  while(words.length<8&&g<80){ const w=WORDS[(wStart+g++)%WORDS.length]; if(!words.some(x=>x.id===w.id)) words.push(w); }
  const sents=[];
  if(cs.length) sents.push(sObj(cs[idx%cs.length]));
  const sStart=idx%SENTS.length; let g2=0;
  while(sents.length<2&&g2<40){ const se=SENTS[(sStart+g2++)%SENTS.length]; if(!sents.some(x=>x.id===se.id)) sents.push(se); }
  const qa=[QA[idx%QA.length]];
  return {words,sents,qa,ids:words.map(w=>w.id).concat(sents.map(x=>x.id),qa.map(q=>q.id))};
}
function isDone(id){ return !!(state.done&&state.done[id]); }
function markDone(id,val){
  if(!state.done) state.done={};
  if(val) state.done[id]=1; else delete state.done[id];
  save();
}

/* ================= 渲染：今日 ================= */
function renderToday(){
  const plan=todayPlan();
  const total=plan.ids.length;
  const doneCount=plan.ids.filter(isDone).length;
  const checked=state.checkins.find(c=>c.date===todayStr());

  $('#todayMeta').textContent=new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})+' · '+total+' 项';
  $('#ringNum').textContent=doneCount;
  $('#ringTotal').textContent='/ '+total;
  const arc=$('#ringArc'); if(arc){ const p=doneCount/total; arc.setAttribute('stroke-dashoffset', String(176*(1-p))); }
  $('#tp1').textContent = checked ? '今天已打卡' : (doneCount===0?'先过一遍今天的卡片':'还剩 '+(total-doneCount)+' 张');
  $('#tp2').textContent = checked ? '明天会先复习今天的内容，别忘回来' : '点卡片右下角「记住了」，过完即可打卡';

  const btn=$('#btnCheck');
  if(checked){
    btn.disabled=true; btn.classList.add('done'); btn.textContent='今天已打卡 ✓';
    $('#checkHint').textContent='连续 '+streakDays()+' 天 · 累计 '+state.checkins.length+' 次';
  }else{
    btn.classList.remove('done');
    btn.disabled=doneCount<1;
    btn.textContent=doneCount<1?'打卡':('打卡 · 已完成 '+doneCount+'/'+total);
    $('#checkHint').textContent=doneCount<1?'至少看过一张卡片才能打卡':(doneCount<total?'还有 '+(total-doneCount)+' 张没标记，也可以先打卡':'今天全部过完，打卡吧');
  }

  $('#todayWordCount').textContent=plan.words.length+' 个';
  $('#todayWords').innerHTML=plan.words.map(w=>wordCard(w,true)).join('');
  $('#todaySents').innerHTML=plan.sents.map(s=>sentCard(s,true)).join('');
  $('#todayQa').innerHTML=plan.qa.map(q=>qaCard(q,true)).join('');
  $('#streakChip').innerHTML='连续 <b>'+streakDays()+'</b> 天';
  updateBadge();
}

/* ================= 渲染：卡片 ================= */
function wordCard(w,inToday){
  const done=isDone(w.id);
  const ipa=w.ipa?('<div class="w-ipa">'+w.ipa+(w.p?' · '+w.p:'')+'</div>'):'';
  return '<div class="wcard'+(done?' done':'')+'" data-id="'+w.id+'">'
    +'<div class="w-top"><div><div class="w-w">'+w.w+(w.custom?'<span class="cust-tag">自建</span>':'')+'</div>'
    +ipa+'</div>'+spkBtn(w.w)+'</div>'
    +(w.zh?'<div class="w-zh">'+w.zh+'</div>':'')
    +(w.ex?'<div class="w-ex"><b>'+w.ex+'</b>'+(w.exz?'<span>'+w.exz+'</span>':'')+'</div>':'')
    +'<div style="margin-top:9px;display:flex;gap:8px;align-items:center">'
    +(inToday?'<button class="chip'+(done?' on':'')+'" data-mark="'+w.id+'" style="min-height:36px">'+(done?'✓ 记住了':'记住了')+'</button>':'')
    +(w.custom?'<button class="mini-btn del-txt" data-del="'+w.id+'">删除</button>':'')
    +'</div>'
    +'</div>';
}
function sentCard(x,inToday){
  const done=isDone(x.id);
  return '<div class="scard" data-id="'+x.id+'" style="'+(done?'border-left-color:#2FA36B;background:#FAFDF9':'')+'">'
    +'<div class="scard-hd"><div class="scard-t">'+x.t+(x.custom?'<span class="cust-tag">自建</span>':'')+'</div>'+spkBtn(x.en)+'</div>'
    +'<div class="scard-en">'+x.en+'</div>'
    +(x.zh?'<div class="scard-zh">'+x.zh+'</div>':'')
    +(x.note?'<div class="scard-note">▸ '+x.note+'</div>':'')
    +'<div style="margin-top:9px;display:flex;gap:8px;align-items:center">'
    +(inToday?'<button class="chip'+(done?' on':'')+'" data-mark="'+x.id+'" style="min-height:36px">'+(done?'✓ 背下来了':'背下来了')+'</button>':'')
    +(x.custom?'<button class="mini-btn del-txt" data-del="'+x.id+'">删除</button>':'')
    +'</div>'
    +'</div>';
}
function qaCard(q,inToday){
  const done=isDone(q.id);
  return '<div class="scard" data-id="'+q.id+'" style="border-left-color:#C4472E;'+(done?'background:#FAFDF9':'')+'">'
    +'<div class="scard-hd"><div class="scard-t">面试题</div>'+spkBtn(q.en)+'</div>'
    +'<div class="w-w" style="font-size:14.5px;margin-top:4px">'+q.q+'</div>'
    +'<div class="scard-en">'+q.en+'</div>'
    +'<div class="scard-zh">'+q.zh+'</div>'
    +(q.tip?'<div class="scard-note">▸ '+q.tip+'</div>':'')
    +(inToday?'<div style="margin-top:9px"><button class="chip'+(done?' on':'')+'" data-mark="'+q.id+'" style="min-height:36px">'+(done?'✓ 练过了':'练过了')+'</button></div>':'')
    +'</div>';
}

/* ================= 词库 ================= */
let wordCat='all';
function renderWordChips(){
  const all=allWords(); const counts={}; all.forEach(w=>counts[w.c]=(counts[w.c]||0)+1);
  let html='<button class="chip'+((wordCat==='all')?' on':'')+'" data-wcat="all">全部 '+all.length+'</button>';
  Object.keys(CATS).forEach(k=>{ if(counts[k]) html+='<button class="chip'+((wordCat===k)?' on':'')+'" data-wcat="'+k+'">'+CATS[k]+' '+counts[k]+'</button>'; });
  if(counts.custom) html+='<button class="chip'+((wordCat==='custom')?' on':'')+'" data-wcat="custom">我的 '+counts.custom+'</button>';
  $('#wordChips').innerHTML=html;
}
function renderWords(){
  const q=($('#wordSearch').value||'').trim().toLowerCase();
  const list=allWords().filter(w=>(wordCat==='all'||w.c===wordCat) && (!q|| w.w.toLowerCase().includes(q)||(w.zh||'').includes(q)||(w.ex||'').toLowerCase().includes(q)));
  if(!list.length){ $('#wordList').innerHTML='<div class="empty">没有匹配的词，换个关键词试试</div>'; return; }
  if(wordCat==='all'&&!q){
    let html='';
    const cust=list.filter(w=>w.custom);
    if(cust.length) html+='<div class="sect-h" style="grid-column:1/-1"><h2>我添加的</h2><span>'+cust.length+' 个</span></div>'+cust.map(w=>wordCard(w,false)).join('');
    Object.keys(CATS).forEach(k=>{
      const g=list.filter(w=>w.c===k&&!w.custom); if(!g.length) return;
      html+='<div class="sect-h" style="grid-column:1/-1"><h2>'+CATS[k]+'</h2><span>'+g.length+' 个</span></div>'+g.map(w=>wordCard(w,false)).join('');
    });
    $('#wordList').innerHTML=html; return;
  }
  $('#wordList').innerHTML=list.map(w=>wordCard(w,false)).join('');
}

/* ================= 复习 ================= */
const LEVELS=[1,1,3,7,14,30];
function dueItems(){
  const d=todayStr();
  return Object.keys(state.learned||{}).filter(id=>{
    const it=state.learned[id];
    return it && it.due && it.due<=d;
  }).map(id=>({id,it:state.learned[id]}));
}
let revQueue=null;
function renderReview(){
  const due=dueItems();
  $('#revMeta').textContent=due.length? (due.length+' 项到期') : '暂无到期';
  if(!due.length){
    $('#revBody').innerHTML='<div class="rdone">今天没有到期复习。<br>打卡后，学过的内容会在第二天、第三天、第七天自动回到这里。</div>';
    return;
  }
  if(!revQueue || revQueue.length===0) revQueue=due.slice();
  const first=revQueue[0];
  const w=getW(first.id), s=getS(first.id), q=getQ(first.id);
  const head = w? w.w : (s? s.t : (q? q.q : first.id));
  const sub  = w? (w.ipa+' · '+w.p) : '句子 / 问答';
  const body = w? ('<b>'+w.zh+'</b><div class="w-ex" style="text-align:left"><b>'+w.ex+'</b><span>'+w.exz+'</span></div>')
      : (s? ('<div class="scard-en" style="text-align:left">'+s.en+'</div><div class="scard-zh">'+s.zh+'</div>')
      : ('<div class="scard-en" style="text-align:left">'+q.en+'</div><div class="scard-zh">'+q.zh+'</div>'));
  $('#revBody').innerHTML='<div class="rev-card">'
    +'<div class="scard-t">还剩 '+revQueue.length+' 项</div>'
    +'<div class="rev-q">'+head+'</div><div class="rev-ipa">'+sub+'</div>'
    +'<div style="margin-top:12px;display:flex;justify-content:center">'+spkBtn(w?w.w:(s?s.en:q.en))+'</div>'
    +'<div class="rev-a" id="revA">'+body+'</div>'
    +'<div class="rev-btns"><button class="btn" id="btnShow">看答案</button></div>'
    +'</div>'
    +'<div style="font-size:11.5px;color:#6B6A66;line-height:1.7;border-top:1px dashed #DAD5C8;padding-top:10px">'
    +'复习节奏：第二天 → 第 3 天 → 第 7 天 → 第 14 天 → 第 30 天。答对往后推，答错回到明天。</div>';
  $('#btnShow').addEventListener('click',()=>{
    const a=$('#revA'); if(!a) return;
    a.classList.add('on');
    $('#revBody').querySelector('.rev-btns').innerHTML='<button class="btn okv" id="btnForgot">忘了，再来</button><button class="btn pri" id="btnKnow">记得</button>';
    $('#btnKnow').addEventListener('click',()=>gradeRev(first.id,true));
    $('#btnForgot').addEventListener('click',()=>gradeRev(first.id,false));
  });
}
function gradeRev(id,know){
  const it=state.learned[id]||{lv:1,due:todayStr()};
  let lv=it.lv||1;
  if(know){ lv=Math.min(LEVELS.length-1,lv+1); } else { lv=Math.max(1,lv-1); }
  const gap = know? LEVELS[lv] : 1;
  state.learned[id]={lv,due:addDays(todayStr(),gap)};
  save();
  revQueue=revQueue.filter(x=>x.id!==id);
  toast(know? '记得 · '+gap+' 天后再复习' : '明天再来一次');
  renderReview(); renderLog(); updateBadge();
}

/* ================= 到期徽标 ================= */
function updateBadge(){
  const n=dueItems().length, b=$('#revBadge');
  if(!b) return;
  b.style.display=n?'inline':'none'; b.textContent=n>99?'99+':String(n);
}
/* ================= 打卡 ================= */
function streakDays(){
  const set=new Set(state.checkins.map(c=>c.date));
  let n=0, d=todayStr();
  if(!set.has(d)) d=addDays(d,-1);
  while(set.has(d)){ n++; d=addDays(d,-1); }
  return n;
}
function doCheck(){
  const plan=todayPlan();
  const doneIds=plan.ids.filter(isDone);
  if(!doneIds.length){ toast('先看一张卡片再打卡'); return; }
  if(state.checkins.some(c=>c.date===todayStr())){ toast('今天已经打过卡了'); return; }
  state.checkins.push({
    date:todayStr(), count:doneIds.length, total:plan.ids.length,
    ids:doneIds, w:doneIds.filter(i=>getW(i)).length,
    s:doneIds.filter(i=>getS(i)).length, q:doneIds.filter(i=>getQ(i)).length
  });
  doneIds.forEach(id=>{
    const cur=state.learned[id];
    if(!cur || !cur.lv){ state.learned[id]={lv:1,due:addDays(todayStr(),1)}; }
  });
  save();
  renderToday(); renderLog(); renderReview(); updateBadge();
  toast('打卡成功 · 明天先复习今天的 '+doneIds.length+' 项');
}

/* ================= 打卡记录 ================= */
function renderLog(){
  $('#stStreak').textContent=streakDays();
  $('#stDays').textContent=state.checkins.length;
  $('#stWords').textContent=Object.keys(state.learned||{}).filter(k=>getW(k)).length;

  const set=new Set(state.checkins.map(c=>c.date));
  const start=addDays(todayStr(),-90);
  let cells='';
  for(let i=0;i<91;i++){
    const d=addDays(start,i);
    cells+='<i class="'+(set.has(d)?'on':'')+(d===todayStr()?' today':'')+'" title="'+d+'"></i>';
  }
  $('#cal').innerHTML=cells;
  $('#calLegend').textContent=start+' → '+todayStr();

  const list=state.checkins.slice().sort((a,b)=>b.date.localeCompare(a.date));
  $('#logCount').textContent=list.length+' 次';
  $('#logBody').innerHTML = list.length? list.map(c=>
      '<div class="log-item"><div><div class="log-d">'+c.date+'</div>'
      +'<div class="log-m">词 '+(c.w||0)+' · 句 '+(c.s||0)+' · 问答 '+(c.q||0)+(c.total&&c.count<c.total?' · 部分完成':'')+'</div></div>'
      +'<div class="mono" style="font-size:13px;color:#1E6B4F">+'+c.count+'</div></div>'
    ).join('') : '<div class="empty">还没有打卡记录，去「今日」过几张卡片再打卡</div>';
}

/* ================= 视图切换 ================= */
function switchView(v){
  state.view=v; save();
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  if(v==='today') renderToday();
  if(v==='words'){ renderWordChips(); renderWords(); }
  if(v==='sents'){ renderSentChips(); renderSents(); }
  if(v==='review'){ revQueue=null; renderReview(); }
  if(v==='today') updateBadge();
  if(v==='log') renderLog();
  window.scrollTo({top:0,behavior:'auto'});
}

/* ================= 添加自建词条 ================= */
let addKind='word', enTouched=false, trSeq=0, trTimer=null;
const CJK=/[\u4e00-\u9fa5]/;
function openSheet(kind){
  addKind=kind; enTouched=false; trSeq++;
  $('#sheetTitle').textContent = kind==='word'?'添加单词':'添加句子 / 段落';
  $('#lblInput').textContent = kind==='word'?'输入中文，会自动翻成英文；直接写英文也会自动补中文':'输入中文句子或段落，会自动翻成英文；直接写英文也会自动补中文';
  $$('.kind .chip').forEach(c=>c.classList.toggle('on',c.dataset.kind===kind));
  ['addInput','addEn','addZh','addNote','addIpa'].forEach(id=>{ $('#'+id).value=''; });
  $('#fldIpa').style.display = kind==='word'?'block':'none';
  $('#trState').textContent=''; $('#trState').className='tr-state';
  $('#mask').classList.add('on'); $('#sheet').classList.add('on');
  setTimeout(()=>$('#addInput').focus(),200);
}
function closeSheet(){ $('#mask').classList.remove('on'); $('#sheet').classList.remove('on'); trSeq++; }
async function mt(text,from,to){
  const u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'%7C'+to;
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok) throw new Error('http '+r.status);
  const j=await r.json();
  const t=(j&&j.responseData&&j.responseData.translatedText)||'';
  if(!t||/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(t)) throw new Error('no result');
  return t.trim();
}
async function autoTranslate(raw){
  const seq=++trSeq, isZh=CJK.test(raw), from=isZh?'zh-CN':'en', to=isZh?'en':'zh-CN';
  $('#trState').className='tr-state'; $('#trState').textContent='翻译中…';
  try{
    const t=await mt(raw,from,to);
    if(seq!==trSeq) return;
    if(isZh){
      if(!enTouched) $('#addEn').value=t;
      if(!$('#addZh').value.trim()) $('#addZh').value=raw;
      $('#trState').textContent='已翻成英文，可以直接改成你习惯的说法';
    }else{
      if(!$('#addEn').value.trim()) $('#addEn').value=raw;
      if(!$('#addZh').value.trim()) $('#addZh').value=t;
      $('#trState').textContent='已补中文（机器翻译，测试术语可能不准，建议自己核一下）';
    }
  }catch(e){
    if(seq!==trSeq) return;
    $('#trState').className='tr-state err';
    $('#trState').textContent = isZh?'翻译服务没连上，请在下面自己填英文':'没连上翻译，中文可以留空';
    if(!isZh && !$('#addEn').value.trim()) $('#addEn').value=raw;
  }
}
function saveCustom(){
  const en=$('#addEn').value.trim();
  if(!en){ toast('英文还空着：翻译没成功就手动填一下'); $('#addEn').focus(); return; }
  const zh=$('#addZh').value.trim(), note=$('#addNote').value.trim();
  const ipa=($('#addIpa').value||'').trim();
  if(!state.custom) state.custom=[];
  state.custom.unshift({id:'c'+Date.now(),kind:addKind,en,zh,note,ipa,ts:todayStr()});
  save(); closeSheet();
  if(addKind==='word'){ wordCat='all'; renderWordChips(); renderWords(); }
  else { sentCat='all'; renderSentChips(); renderSents(); }
  renderToday();
  toast('已保存 · 会出现在词库和以后的每日打卡里');
}
function delCustom(id){
  if(!confirm('删除这条自己添加的内容？')) return;
  state.custom=(state.custom||[]).filter(i=>i.id!==id);
  delete state.learned[id]; delete state.done[id];
  save(); renderToday(); renderWordChips(); renderWords(); renderSentChips(); renderSents(); renderLog(); updateBadge();
  toast('已删除');
}
$('#addInput').addEventListener('input',()=>{
  const raw=$('#addInput').value.trim();
  clearTimeout(trTimer);
  if(!raw){ $('#trState').textContent=''; return; }
  trTimer=setTimeout(()=>autoTranslate(raw),650);
});
$('#addEn').addEventListener('input',()=>{ enTouched=true; });
$$('.kind .chip').forEach(c=>c.addEventListener('click',()=>openSheet(c.dataset.kind)));
$('#btnAddWord').addEventListener('click',()=>openSheet('word'));
$('#btnAddSent').addEventListener('click',()=>openSheet('sent'));
$('#sheetClose').addEventListener('click',closeSheet);
$('#btnCancel').addEventListener('click',closeSheet);
$('#mask').addEventListener('click',closeSheet);
